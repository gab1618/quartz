hyper-tls = { workspace = true }
chrono = "0.4.26"
openssl = { version = "0.10.55", features = ["vendored"] }
serde_json = "1.0.112"
tempfile = "3.23.0"
thiserror = { workspace = true }
dirs = "6.0.0"

[dev-dependencies]
cuid = "1.3.2"
